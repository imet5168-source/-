<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星語塔羅</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: one centered reading column; the deck, the table and the daily card are the only framed objects. */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#f6f1e7; --bg2:#ece3d1; --ink:#2b2340; --muted:#6b6280;
  --gold:#8f6a22; --gold2:#d4b26a; --card:#2b2147; --card2:#463670;
  --face:#fffaf0; --line:#d9ccb0; --accent:#6d3591; --rev:#a63d31; --on-gold:#fff;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120e1f; --bg2:#1d1730; --ink:#efe8ff; --muted:#a89cc4;
    --gold:#d4b26a; --gold2:#f0d798; --card:#2b2147; --card2:#4c3a7d;
    --face:#1f1933; --line:#3a2f57; --accent:#c597ea; --rev:#e88a7d; --on-gold:#1a1428; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120e1f; --bg2:#1d1730; --ink:#efe8ff; --muted:#a89cc4;
  --gold:#d4b26a; --gold2:#f0d798; --card:#2b2147; --card2:#4c3a7d;
  --face:#1f1933; --line:#3a2f57; --accent:#c597ea; --rev:#e88a7d; --on-gold:#1a1428; color-scheme:dark;
}
body{background:var(--bg);background-image:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%);background-attachment:fixed;color:var(--ink);
  font-family:var(--sans);font-size:15px;min-height:100vh;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
header{text-align:center}
h1{font-family:var(--serif);font-size:2rem;letter-spacing:.3em;color:var(--gold);text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem}
.panel{background:color-mix(in srgb,var(--face) 88%,transparent);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.step-title{font-family:var(--serif);font-size:1.05rem;color:var(--accent);margin-bottom:10px}
input[type=text]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.spreads{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.spread{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg);text-align:left;color:var(--ink);font:inherit}
.spread.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.spread b{display:block}.spread small{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
button{font:inherit;cursor:pointer}
.btn{border-radius:999px;padding:9px 22px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{text-align:center;color:var(--muted);font-size:.88rem;margin-top:6px}
.deckinfo{color:var(--muted);font-size:.85rem;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.seg button{border:0;background:transparent;color:var(--ink);padding:5px 14px}
.seg button.on{background:var(--gold);color:var(--on-gold)}

/* daily */
.daily{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.streak{font-family:var(--serif);font-size:2.2rem;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.streak small{font-size:.9rem;color:var(--muted);font-family:var(--sans)}
.week{display:flex;gap:6px;margin:10px 0}
.week span{width:30px;text-align:center;font-size:.72rem;color:var(--muted)}
.week i{display:block;width:22px;height:22px;margin:0 auto 2px;border-radius:50%;border:1px solid var(--line)}
.week i.ok{background:var(--gold2);border-color:var(--gold)}
.week i.today{box-shadow:0 0 0 2px var(--accent)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.75rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.got{border-color:var(--gold);color:var(--gold)}
.dailytext{min-width:0}
@media (max-width:560px){.daily{grid-template-columns:1fr;justify-items:center;text-align:center}.week,.badges{justify-content:center}}

/* deck fan */
.fan{display:flex;flex-wrap:wrap;justify-content:center;padding:14px 0 4px 22px;row-gap:8px}
.back{width:42px;height:70px;margin-left:-22px;border-radius:6px;cursor:pointer;transition:transform .2s,opacity .3s;
  background:repeating-linear-gradient(45deg,var(--card) 0 6px,var(--card2) 6px 12px);border:2px solid var(--gold2);position:relative;box-shadow:-2px 0 4px rgba(0,0,0,.25)}
.back::after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold2);font-size:13px}
.back:hover{transform:translateY(-10px)}
.back.taken{opacity:.12;pointer-events:none}
.shuffling .back{animation:shuf .45s ease-in-out infinite alternate}
@keyframes shuf{to{transform:translateY(-6px) rotate(5deg)}}

/* table */
.table{display:grid;gap:16px;justify-content:center;margin:10px 0}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot .pos{font-size:.85rem;color:var(--muted)}
.tcard{width:130px;height:216px;perspective:900px;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.inner{width:100%;height:100%;position:relative;transition:transform .8s;transform-style:preserve-3d}
.tcard.flipped .inner{transform:rotateY(180deg)}
.side{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;border:2px solid var(--gold2)}
.side.b{background:repeating-linear-gradient(45deg,var(--card) 0 8px,var(--card2) 8px 16px);display:grid;place-items:center;color:var(--gold2);font-size:28px}
.side.f{transform:rotateY(180deg);background:linear-gradient(160deg,var(--face),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 6px;text-align:center}
.side.f .num{color:var(--gold);font-size:.8rem;letter-spacing:.1em}
.sym{font-size:46px;line-height:1;color:var(--ink)}
.sym.s-w,.sym.s-p{color:var(--gold)}.sym.s-c,.sym.s-s{color:var(--accent)}
.side.f .nm{font-family:var(--serif);font-weight:700;font-size:.95rem}.side.f .en{font-size:.68rem;color:var(--muted)}
.tcard.rev .sym.mj{transform:rotate(180deg)}
.tag{font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid}
.tag.up{color:var(--accent);border-color:var(--accent)}.tag.dn{color:var(--rev);border-color:var(--rev)}
@media (prefers-reduced-motion:reduce){.inner,.back{transition:none}.shuffling .back{animation:none}}

/* readings */
.reading{border-left:3px solid var(--gold);padding:6px 12px;margin:10px 0}
.reading h3{font-family:var(--serif);font-size:1rem}.reading .kw{color:var(--muted);font-size:.85rem}
.summary,.ai{background:var(--bg);border-radius:10px;padding:12px;margin-top:10px}
.ai{border:1px dashed var(--accent);white-space:pre-wrap}
.ai .lbl{font-family:var(--serif);color:var(--accent);font-weight:700;display:block;margin-bottom:4px;white-space:normal}
.hist li{list-style:none;border-bottom:1px dashed var(--line);padding:6px 0;font-size:.9rem}
.hist .d{color:var(--muted);font-size:.8rem}
.theme{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));padding:4px 10px;font-size:.8rem;z-index:5}
.foot{text-align:center;color:var(--muted);font-size:.85rem}

/* share dialog */
.modal{position:fixed;inset:0;background:rgba(10,6,20,.72);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--face);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.modal img{width:100%;border-radius:8px;display:block}
@media (max-width:520px){.tcard{width:96px;height:160px}.sym{font-size:32px}.side.f .nm{font-size:.82rem}.side.f .en{display:none}h1{font-size:1.5rem}.back{width:34px;height:56px;margin-left:-18px}}
</style>
</head>
<body>
<button class="btn ghost theme" id="themeBtn" aria-label="切換深色或淺色主題">◐</button>
<div class="wrap">
  <header>
    <h1>星語塔羅</h1>
    <p class="sub">靜心 · 提問 · 抽牌 · 解讀 —— 完整 78 張偉特體系牌義</p>
  </header>

  <!-- Daily card -->
  <section class="panel" id="dailyPanel">
    <div class="step-title">今日一牌 · 連續打卡</div>
    <div class="daily">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <button class="tcard" id="dailyCard" aria-label="抽今日一牌"><div class="inner"><div class="side b">✦</div><div class="side f" id="dailyFace"></div></div></button>
      </div>
      <div class="dailytext">
        <div class="streak"><span id="streakN">0</span> <small>天連續打卡 · 最長 <span id="bestN">0</span> 天 · 累計 <span id="totalN">0</span> 天</small></div>
        <div class="week" id="week"></div>
        <div class="badges" id="badges"></div>
        <p id="dailyMsg" style="margin-top:10px">點擊左側牌背,抽出今天的指引牌。</p>
        <div class="row" style="justify-content:flex-start" id="dailyBtns" hidden>
          <button class="btn ghost" id="dailyShare">產生分享圖卡</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Step 1 -->
  <section class="panel" id="s1">
    <div class="step-title">① 寫下你的問題</div>
    <input type="text" id="q" maxlength="80" placeholder="例:接下來三個月,我的工作方向該如何調整?">
    <div class="step-title" style="margin-top:16px">② 選擇牌陣與牌組</div>
    <div class="spreads" id="spreads"></div>
    <div class="deckinfo">牌組:
      <span class="seg" id="deckSeg"><button data-d="full" class="on">完整 78 張</button><button data-d="major">大阿爾克那 22 張</button></span>
    </div>
    <div class="row"><button class="btn" id="startBtn">開始洗牌</button></div>
  </section>

  <!-- Step 2 -->
  <section class="panel" id="s2" hidden>
    <div class="step-title">③ 憑直覺抽出 <span id="needN"></span> 張牌</div>
    <div class="fan" id="fan"></div>
    <p class="hint" id="pickHint"></p>
  </section>

  <!-- Step 3 -->
  <section class="panel" id="s3" hidden>
    <div class="step-title">④ 點擊牌面翻牌</div>
    <div class="table" id="table"></div>
    <div class="row"><button class="btn ghost" id="flipAll">全部翻開</button></div>
    <div id="readings"></div>
    <div class="row" id="afterBtns" hidden>
      <button class="btn" id="aiBtn">AI 個人化解讀</button>
      <button class="btn ghost" id="shareBtn">產生分享圖卡</button>
      <button class="btn ghost" id="againBtn">再抽一次</button>
    </div>
    <p class="hint" id="aiNote"></p>
  </section>

  <section class="panel">
    <div class="step-title">抽牌紀錄(只存在這台裝置的瀏覽器)</div>
    <ul class="hist" id="hist"></ul>
    <div class="row"><button class="btn ghost" id="clearHist">清除紀錄</button></div>
  </section>
  <p class="foot">塔羅僅供娛樂與自我反思參考,重大決定請依實際情況審慎判斷。</p>
</div>

<div class="modal" id="modal" hidden>
  <div class="box">
    <img id="shareImg" alt="分享圖卡預覽">
    <p class="hint">手機可長按圖片儲存或分享到社群</p>
    <div class="row">
      <button class="btn" id="saveImg">儲存圖片</button>
      <button class="btn ghost" id="closeModal">關閉</button>
    </div>
    <p class="hint" id="saveNote"></p>
  </div>
</div>

<script>

function wrapLines(ctx,text,maxW){const out=[];let line="";for(const ch of text){if(ch==="\n"){out.push(line);line="";continue}

    cx+=cw+gap;

$("#saveImg").onclick=async()=>{
  if(!shareBlob)return;const fn=`tarot-${dkey(new Date())}.png`;
  if(downloads){try{await downloads.save({filename:fn,data:shareBlob});$("#saveNote").textContent="已儲存。"}
    catch(e){$("#saveNote").textContent=e.code==="declined"?"已取消儲存。":"這裡無法直接儲存,請長按或右鍵圖片另存。"}return}
  if(window.claude?.use){$("#saveNote").textContent="請長按或右鍵圖片另存。";return}
  const a=document.createElement("a");a.href=$("#shareImg").src;a.download=fn;document.body.appendChild(a);a.click();a.remove();
};

/* ---------- history ---------- */
const HKEY="tarot-history";
function saveHist(q){const h=store.get(HKEY,[]);h.unshift({d:new Date().toLocaleString("zh-TW"),q,s:spread.name,c:picks.map(p=>CARDS[p.i].name+(p.rev?"(逆)":""))});store.set(HKEY,h.slice(0,20));renderHist()}
function renderHist(){const h=store.get(HKEY,[]);$("#hist").innerHTML=h.length?h.map(x=>`<li><span class="d">${esc(x.d)} · ${esc(x.s)}</span><br>${x.q?esc(x.q)+" → ":""}${esc(x.c.join("、"))}</li>`).join(""):'<li class="d">還沒有抽牌紀錄,完成一次抽牌後會出現在這裡。</li>'}
$("#clearHist").onclick=()=>{store.set(HKEY,[]);renderHist()};
$("#againBtn").onclick=()=>{$("#s2").hidden=true;$("#s3").hidden=true;$("#s1").scrollIntoView({behavior:"smooth"})};

renderDaily();renderHist();
</script>
